<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share moments · Gnogolf mockup</title>
<link rel="stylesheet" href="kit.css">
<!-- The share moments: one sheet, the card that will travel, its words, one way to send it.
     Desktop: Copy the link first (a post anywhere), X and Bluesky beside, the picture to download.
     Phone: Share… first (the system sheet takes the picture, the words and the link).
     states: ?state=bought (default) | equipped | bidding | won | published (a hole, its ghost dare) | clip (the shot, the gnome in it) | team (the player's gnomes) -->
<style>
  body { overflow: hidden; height: 100vh; }
  .behind { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .sheet__in { max-width: 520px; display: grid; gap: var(--sp-4); }
  .sheet h2 { margin: 0; }
  /* the card, as it will look in a post: the card page itself, scaled */
  .preview { position: relative; width: 100%; aspect-ratio: 1200 / 630; border: var(--edge); border-radius: 14px; overflow: hidden; background: var(--s0, #fff3df); }
  .preview iframe { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .preview--clip { background: url(img/play-garden3.jpg) 40% 45% / cover; aspect-ratio: 16 / 9; }
  .preview--clip .round { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .sheet p.words { margin: 0; padding: var(--sp-3) var(--sp-4); border: var(--info-edge); border-radius: 14px; background: var(--info-bg); font-size: 15px; font-weight: 600; line-height: 1.4; }
  .acts { display: grid; grid-template-columns: 1fr auto auto auto; gap: var(--sp-2); align-items: stretch; }
  .acts .btn { min-height: 48px; margin: 0; }
  .acts .share__icon { width: 48px; height: 48px; }
  .acts .share__icon svg { width: 20px; height: 20px; }
  @media (max-width: 600px) { .acts { grid-template-columns: 1fr auto; } .acts .share__icon--x, .acts .share__icon--bsky { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="kit.js"></script>
<script>
  const { ICON, state } = Kit;
  const s = state("bought");
  const phone = matchMedia("(max-width: 600px)").matches;
  const M = {
    bought: ["gnome-detail.html?state=mine", "Tansy's yours", "Show your gnome", "gnome", "I just adopted Tansy, gnome #94 of Gnogolf. He rolls for me now ⛳ gnogolf.xyz/g/94"],
    equipped: ["gnome-locker.html?state=shown", "Your rivals will see him", "Shown to everyone", "gnome", "My gnome for the boards: Tansy of the Garden. Race his ghost ⛳ gnogolf.xyz/g/94"],
    bidding: ["gnome-auction.html?state=leading", "You lead", "Share the auction", "auction", "I'm bidding on the Windmill King, one of seven. Ends Sat 18:00 UTC ⛳ gnogolf.xyz/g/715"],
    won: ["gnome-auction.html?state=won", "The Windmill King is yours", "Show him off", "auction", "The Windmill King is mine: one of seven Legendary gnomes of Gnogolf ⛳ gnogolf.xyz/g/715"],
    published: ["builder-editor.html?state=proved", "Mole Run is on gno.land", "Dare them with your ghost", "hole", "I built Mole Run, par 5. Beat my 4: race my ghost, free, no wallet ⛳ gnogolf.xyz/?hole=…&by=nym-twee"],
    team: ["collection.html", "Your team of 31", "Share my team", "team", "My Gnogolf team: 31 gnomes, the Windmill King up front. Race their ghosts ⛳ gnogolf.xyz"],
    clip: ["gnome-places.html", "What a shot", "Your gnome, holing it", "", "Tansy sank Down the Tunnel in one. Physics by a realm on-chain, excuses by me ⛳"],
  }[s];
  const [behind, title, eyebrow, card, words] = M;
  const preview = s === "clip"
    ? `<div class="preview preview--clip"><button class="round round--big" aria-label="Play the clip">${ICON.play}</button></div>`
    : `<div class="preview"><iframe src="share-card.html?state=${card}" title="The share card" tabindex="-1" aria-hidden="true"></iframe></div>`;
  const first = phone
    ? `<button class="btn btn--main">${ICON.more} Share…</button>`
    : s === "clip" ? `<button class="btn btn--main">Download the clip</button>` : `<button class="btn btn--main">${ICON.copy} Copy the link</button>`;
  const rest = phone
    ? `<a class="share__icon share__icon--copy" aria-label="Copy the link">${ICON.copy}</a>`
    : `<a class="share__icon share__icon--x" aria-label="Post on X">${ICON.x}</a><a class="share__icon share__icon--bsky" aria-label="Post on Bluesky">${ICON.bsky}</a><a class="share__icon share__icon--copy" aria-label="${s === "clip" ? "Copy the link" : "Download the picture"}">${s === "clip" ? ICON.copy : ICON.down}</a>`;
  document.getElementById("app").innerHTML = `
    <iframe class="behind" src="${behind}" title="The screen behind" aria-hidden="true" tabindex="-1"></iframe>
    <div class="sheet"><div class="sheet__in" role="dialog" aria-modal="true" aria-label="${title}">
      <button class="round round--small sheet__close" aria-label="Close">${ICON.close}</button>
      <div><span class="eyebrow">${eyebrow}</span><h2>${title}</h2></div>
      ${preview}
      <p class="words">${words}</p>
      <div class="sheet__foot"><div class="acts">${first}${rest}</div></div>
    </div></div>`;
  // the card page drawn at 1200 px, scaled to the sheet's width
  const fit = () => document.querySelectorAll(".preview iframe").forEach((f) => (f.style.transform = `scale(${f.parentElement.clientWidth / 1200})`));
  fit(); addEventListener("resize", fit);
</script>
</body>
</html>
