<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A gnome · Gnogolf mockup</title>
<link rel="stylesheet" href="kit.css">
<!-- A gnome's page: see him, buy him. One action per state, in the buy panel.
     states: ?state=open (default) | nowallet | locked (players' window, no record) | cap (the window's share used)
     | mine | taken | later (a wave not open) | nevermade (the sale closed before he found a player) -->
<style>
  .gd { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-6) var(--sp-7); width: min(1080px, 100%); margin: 0 auto; align-items: center; }
  .gd__stage { display: grid; gap: var(--sp-4); justify-items: center; }
  .gd__tile { width: 100%; max-width: 460px; border-radius: var(--r-panel); box-shadow: var(--deep-card); cursor: grab; }
  .gd__tile img { animation: turn 7s ease-in-out infinite; }
  @keyframes turn { 25% { transform: rotateY(25deg); } 75% { transform: rotateY(-25deg); } }
  .gd__nav { display: flex; gap: var(--sp-3); align-items: center; font-size: 14px; font-weight: 700; color: var(--ink-soft); }
  .gd__tile--never { border-style: dashed; box-shadow: none; background: rgba(var(--ink-rgb), .04); }
  .gd__tile--never::before { box-shadow: none; }
  .gd__tile--never img { filter: grayscale(1) brightness(1.15) opacity(.3); animation: none; }

  .gd__info { display: grid; gap: var(--sp-4); align-content: start; }
  .gd__meta { display: flex; align-items: center; gap: var(--sp-2); font-size: 14px; font-weight: 700; color: var(--ink-soft); }
  .gd__name { margin: 0; font-size: clamp(40px, 4.4vw, 60px); line-height: 1; --ink-w: 7px; --ink-drop: 5px; }
  .gd__line { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.4; max-width: 34em; }
  .gd__who { margin: 0; font-size: 15px; }
  .traits { margin: 0; }
  .traits p { display: grid; grid-template-columns: 70px 1fr; gap: var(--sp-1) var(--sp-3); margin: 0; }

  .buy { display: grid; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); text-align: center; }
  .buy__price { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: var(--sp-1) var(--sp-3); }
  .buy__price b { font-size: 36px; line-height: 1; }
  .buy__price span { font-size: 14px; font-weight: 600; color: var(--ink-soft); }
  .buy .btn--cta { width: 100%; margin: 0; }
  .buy .note { margin: 0; }
  .buy .trust { margin: 0; justify-content: center; }
  @media (max-width: 860px) { .gd { grid-template-columns: 1fr; } }
  @media (max-width: 600px) {
    .gd__tile { max-width: 300px; }
    .gd__name { font-size: 40px; --ink-w: 6px; }
    .gd__line { font-size: 16px; }
    .buy { padding: var(--sp-4); }
    .buy__price b { font-size: 30px; }
  }
</style>
</head>
<body>
<main class="front tint--garden" id="app"></main>
<script src="kit.js"></script>
<script>
  const { ICON, tierChip, gnome, state, corners, netbanner, CLOSES, trust } = Kit;
  const s = state("open");
  const g = gnome(94);
  g.art = "img/g02.png";
  const first = g.name.split(" of ")[0];
  const price = `<div class="buy__price"><b>${g.price} GNOT</b><span>+ ≈ 0.3 GNOT deposit</span></div>`;
  const buy = (button, note = "") => `<section class="panel buy" aria-label="Buy him">${price}${button}${note}${trust()}</section>`;
  const panel = {
    open: buy(`<button class="btn btn--chain btn--cta">Buy ${first}</button>`),
    nowallet: buy(`<button class="btn btn--chain btn--cta">Buy ${first}</button>`, `<p class="fine" style="margin:0">With Adena, or a gnokey command: the next step has both.</p>`),
    locked: buy(`<button class="btn btn--chain btn--cta" disabled>Players first until Thu 18:00 UTC</button>`, `<p class="note note--warn">Save one round on-chain to buy now. <a href="#">Play a hole →</a></p>`),
    cap: buy(`<button class="btn btn--chain btn--cta" disabled>3 of 3 Commons this wave</button>`, `<p class="note note--warn">Your share until Thu 18:00 UTC. Then open to everyone.</p>`),
    mine: `<section class="panel buy"><button class="btn btn--gold btn--cta">Play with him</button>
      <p class="fine" style="margin:0">Your ghost wears him. <button class="linkish">Show him off</button></p></section>`,
    taken: `<section class="panel buy"><a class="btn btn--gold btn--cta" href="#">Race nym-gnorman's ghost</a></section>`,
    later: `<section class="panel buy"><div class="buy__price"><b>${g.price} GNOT</b><span>from Wave 2 · Island</span></div>
      <button class="btn btn--ghost btn--cta">♡ Keep him on my list</button>
      <p class="fine" style="margin:0">A wave not open by ${CLOSES} never opens.</p></section>`,
    nevermade: `<section class="panel buy"><p class="gd__who"><b>Never made.</b> The sale closed before he found a player.</p>
      <a class="btn btn--ghost btn--cta" href="gnomes-gallery.html?state=closed">See the gnomes that were made</a></section>`,
  }[s];
  const who = s === "mine" ? `<p class="gd__who"><b>Yours</b> since 4 Oct</p>` : s === "taken" ? `<p class="gd__who">Plays with <b>nym-gnorman</b></p>` : "";

  document.getElementById("app").innerHTML = `
    ${corners("Back to the gnomes")}
    <div class="gd">
      <div class="gd__stage">
        <span class="gtile gtile--${g.tier} gd__tile tint--${g.world}${s === "nevermade" ? " gd__tile--never" : ""}" role="img" aria-label="${g.name}, turning: drag, or the arrow keys, to turn him"><img src="${g.art}" alt=""></span>
        <div class="gd__nav"><button class="round" aria-label="Previous gnome, #93">${ICON.back}</button><span>#93 · #95</span><button class="round" aria-label="Next gnome, #95">${ICON.next}</button></div>
      </div>
      <div class="gd__info">
        <div class="gd__meta">${tierChip(g.tier)}<span>#${g.id} · Wave ${s === "later" ? "2 · Island" : "1 · Garden"}</span></div>
        <h1 class="gd__name inked">${g.name}</h1>
        <p class="gd__line">A bobble that will not sit still, and a trail of petals behind every putt.</p>
        ${who}
        ${panel}
        <details class="more traits"><summary>His traits</summary>
          <p><span>Hat</span><b>Bobble, moss green</b><span>Beard</span><b>Bushy, ginger</b><span>Extra</span><b>Rosy cheeks</b><span>Trail</span><b>Petals</b></p></details>
      </div>
    </div>
    ${netbanner()}`;
</script>
</body>
</html>
