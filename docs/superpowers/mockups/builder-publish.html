<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Publishing a hole · Gnogolf mockup</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="builder.css">
<!-- Publishing, a sheet over the editor: name it, see the cost, sign. The chain's checks run on their own
     and show only when one fails. states: ?state=name (default) | refused (the name looks like a link)
     | cost | newer (a newer version published elsewhere) | closed (publishing not open) | pending | done -->
<style>
  body { overflow: hidden; height: 100vh; }
  .behind { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .sheet__in { max-width: 460px; display: grid; gap: var(--sp-4); }
  .sheet__in > :not(.sheet__foot) { margin: 0; }
  .steps2 { display: flex; gap: var(--sp-2); font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .steps2 b { color: var(--ink); }
  .lbl span { display: flex; justify-content: space-between; }
  textarea.field { height: 76px; padding-top: 10px; resize: none; }
  .bill { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-2) var(--sp-4); padding: var(--sp-3) var(--sp-4); border: var(--edge); border-radius: 14px; background: var(--white); font-size: 15px; align-items: baseline; }
  .bill b { text-align: right; }
  .bill .bill__total { padding-top: var(--sp-2); border-top: var(--rule); font-size: 17px; }
  .bill b.bill__total { font-size: 20px; }
  .shot { position: relative; aspect-ratio: 1200 / 630; border: var(--edge); border-radius: 14px; overflow: hidden; }
  .shot iframe { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
  .row2 .btn { min-height: 52px; margin: 0; }
  .center { text-align: center; justify-items: center; }
  .hop { width: 180px; height: 110px; position: relative; border: var(--edge-bold); border-radius: 14px; overflow: hidden; background: #5c9a78; animation: hop .7s ease-in-out infinite alternate; }
  @keyframes hop { to { transform: translateY(-12px); } }
</style>
</head>
<body>
<iframe class="behind" src="builder-editor.html?state=proved" title="The editor, behind the sheet" aria-hidden="true" tabindex="-1"></iframe>
<div class="sheet" id="app"></div>
<script src="kit.js"></script>
<script src="builder.js"></script>
<script>
  if (matchMedia("(max-width: 899px), (pointer: coarse)").matches) location.replace("builder-phone.html");
  const { ICON, state } = Kit;
  const { holeSVG } = Builder;
  const s = state("name");
  const step = (n) => `<p class="steps2" aria-label="Step ${n} of 2"><span>${n === 1 ? "<b>1 · Name</b>" : "1 · Name ✓"}</span><span>·</span><span>${n === 2 ? "<b>2 · Publish</b>" : "2 · Publish"}</span></p>`;
  const close = `<button class="round round--small sheet__close" aria-label="Close: the draft stays">${ICON.close}</button>`;
  const foot = (b) => `<div class="sheet__foot">${b}</div>`;
  const name = (bad) => `${step(1)}<h2>Name it</h2>
    <label class="lbl"><span>Name <span class="count">${bad ? "10" : "8"} / 40</span></span><input class="field${bad ? " field--bad" : ""}" value="${bad ? "St.Andrews" : "Mole Run"}"></label>
    ${bad ? `<p class="note note--bad">Looks like a web address. Try "St. Andrews".</p>` : ""}
    <label class="lbl"><span>A line for players <span class="count">29 / 140</span></span><textarea class="field">Mind the gate, and the moles.</textarea></label>
    ${foot(`<button class="btn btn--main btn--wide"${bad ? " disabled" : ""}>Next</button>`)}`;
  const gnokey = `<details class="more"><summary>Publish with gnokey instead</summary><div><code class="code">gnokey maketx call -pkgpath "gno.land/r/gnogolf/golf/v2" -func "PublishMine" -args "mole-run" -args "4747310001…" -args "Mind the gate, and the moles." -gas-fee 1500000ugnot -gas-wanted 205000000 -broadcast -chainid gnoland-1 -remote https://rpc.gno.land:443 my-key</code>
    <button class="btn btn--main btn--s" style="margin-top:8px">Copy</button></div></details>`;

  const body = {
    name: name(false),
    refused: name(true),
    cost: `${step(2)}<h2>Publish Mole Run</h2>
      <div class="bill" aria-label="The bill"><span>Storage deposit</span><b>≈ 0.89 GNOT</b><span>Network fee</span><b>≈ 0.31 GNOT</b><span class="bill__total">At most</span><b class="bill__total">1.20 GNOT</b></div>
      <p class="fine">The chain's price for keeping and checking the hole. Nothing goes to the game.</p>${gnokey}
      ${foot(`<button class="btn btn--chain btn--wide">Publish in Adena · 1.20 GNOT</button>`)}`,
    newer: `${step(2)}<h2>Publish Mole Run</h2><p class="note note--warn">A v2 was published elsewhere. This one would be v3, with new weather: test it again (free).</p>
      ${foot(`<button class="btn btn--gold btn--wide">${ICON.play} Test again</button>`)}`,
    closed: `<h2>Not open yet</h2><p class="lead">Publishing isn't open on gno.land yet. Your draft is kept.</p>
      ${foot(`<button class="btn btn--main btn--wide">Back to the editor</button>`)}`,
    pending: `<div class="center" style="display:grid;gap:var(--sp-4)"><div class="hop">${holeSVG({ small: true })}</div><h2 style="font-size:24px">Sign in Adena…</h2></div>`,
    done: `<h2>Mole Run is on gno.land!</h2>
      <div class="shot"><iframe src="share-card.html?state=hole" title="The hole's share card" tabindex="-1" aria-hidden="true"></iframe></div>
      <p class="lead">Play it for real: your best becomes the ghost your friends race.</p>
      ${foot(`<div class="row2"><button class="btn btn--gold">${ICON.play} Play it for real</button><a class="btn btn--ghost" href="share.html?state=published">${ICON.more} Share the hole</a></div>`)}`,
  }[s];
  document.getElementById("app").innerHTML = `<div class="sheet__in" role="dialog" aria-modal="true" aria-label="Publish Mole Run">${s === "pending" ? "" : close}${body}</div>`;
  const fit = () => document.querySelectorAll(".shot iframe").forEach((f) => (f.style.transform = `scale(${f.parentElement.clientWidth / 1200})`));
  fit(); addEventListener("resize", fit);
</script>
</body>
</html>
