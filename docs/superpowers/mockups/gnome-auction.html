<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Legendary's auction · Gnogolf mockup</title>
<link rel="stylesheet" href="kit.css">
<!-- A Legendary's auction: the top bid, the end, one bid. The rules and the bids behind a tap.
     states: ?state=live (default: someone else leads) | outbid | leading | extended (a late bid moved the end)
     | ended (to hand over) | won | nobid | upcoming -->
<style>
  /* the night: paper and a pale lilac on #2b2550 (13:1 and 11:1, AAA at any size) */
  .front { color: var(--paper); --night-soft: #e2dcff; }
  .au { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-6) var(--sp-7); width: min(1080px, 100%); margin: 0 auto; align-items: center; }
  .au__tile { width: 100%; max-width: 440px; justify-self: center; border-radius: var(--r-panel); box-shadow: 0 0 0 6px var(--c1), 0 0 0 9px var(--ink), 0 14px 0 6px var(--ink), 0 0 80px 20px rgba(255, 215, 94, .3); }
  .au__info { display: grid; gap: var(--sp-4); align-content: start; }
  .au__meta { display: flex; align-items: center; gap: var(--sp-2); font-size: 14px; font-weight: 700; color: var(--night-soft); }
  .au__name { margin: 0; font-size: clamp(40px, 4.6vw, 62px); line-height: 1; color: var(--tier-legendary); --ink-w: 7px; --ink-drop: 5px; }

  .bid { color: var(--ink); display: grid; gap: var(--sp-4); padding: var(--sp-4) var(--sp-5); }
  .bid__top { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-1) var(--sp-4); align-items: end; }
  .bid__top .eyebrow { grid-column: 1 / -1; }
  .bid__top b { font-size: 40px; line-height: 1; }
  .bid__top small { font-size: 15px; font-weight: 700; }
  .bid__by { grid-column: 1; font-size: 15px; }
  .clock { grid-row: 2 / 4; grid-column: 2; text-align: right; display: grid; gap: var(--sp-1); align-self: end; }
  .clock strong { font-size: 24px; line-height: 1; }
  .clock span { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .clock--late strong { color: var(--hat-ink); }
  /* the form: the field and the button one height, one row */
  .bid__form { display: grid; grid-template-columns: 1fr 1.3fr; gap: var(--sp-3); }
  .bid__field { position: relative; }
  .bid__field .field { height: 56px; font-size: 22px; font-weight: 700; padding-right: 64px; }
  .bid__field span { position: absolute; right: var(--sp-4); top: 0; line-height: 56px; font-size: 14px; font-weight: 800; color: var(--ink-soft); }
  .bid__form .btn { height: 56px; margin: 0; font-size: 18px; font-weight: 700; border-radius: 16px; }
  .bid .note, .bid .fine, .bid .more { margin: 0; }
  .hist { list-style: none; margin: var(--sp-2) 0 0; padding: 0; display: grid; gap: var(--sp-1); }
  .hist li { display: grid; grid-template-columns: 1fr 110px 92px; gap: var(--sp-3); font-size: 14px; color: var(--ink); }
  .hist li b, .hist li time { text-align: right; }
  .hist li.me { font-weight: 700; }
  .shareit { justify-self: start; color: var(--tier-legendary); font-size: 15px; }
  @media (max-width: 860px) { .au { grid-template-columns: 1fr; } .au__tile { max-width: 260px; } }
  @media (max-width: 600px) { .bid { padding: var(--sp-4); } .bid__form { grid-template-columns: 1fr; } .bid__top b { font-size: 34px; } }
</style>
</head>
<body>
<main class="front tint--legend" id="app"></main>
<script src="kit.js"></script>
<script>
  const { ICON, TIER_ICON, state, corners, netbanner } = Kit;
  const s = state("live");
  const best = { live: "1,240", outbid: "1,302", leading: "1,302", extended: "1,368", ended: "1,368", won: "1,368" }[s];
  const min = { live: "1,302", outbid: "1,368", extended: "1,437" }[s];
  const by = { live: "nym-moustache943", outbid: "nym-moustache943", extended: "nym-zxxma042", ended: "nym-zxxma042" }[s];
  const clock = s === "extended" ? `<div class="clock clock--late" role="timer" aria-live="off"><strong>Ends 18:10 UTC</strong><span>Moved 10 min by a late bid</span></div>`
    : s === "ended" || s === "won" || s === "nobid" ? `<div class="clock"><strong>Ended</strong><span>Sat 11 Oct, 18:10 UTC</span></div>`
    : s === "upcoming" ? `<div class="clock"><strong>Fri 10 Oct</strong><span>Opens 18:00 UTC</span></div>`
    : `<div class="clock"><strong>Sat 18:00 UTC</strong><span>Ends Sat 11 Oct</span></div>`;
  const head = s === "nobid" || s === "upcoming"
    ? `<div class="bid__top"><span class="eyebrow">${s === "nobid" ? "Nobody bid the reserve" : "Opening bid"}</span><b>777 <small>GNOT</small></b>${clock}</div>`
    : `<div class="bid__top"><span class="eyebrow">${s === "won" ? "Your winning bid" : s === "leading" ? "You lead with" : "Top bid"}</span><b>${best} <small>GNOT</small></b>${by ? `<span class="bid__by">by ${by}</span>` : ""}${clock}</div>`;
  const form = (label = "Bid") => `<div class="bid__form"><label class="bid__field"><input class="field" inputmode="numeric" value="${min}" aria-label="Your bid, in GNOT, at least ${min}"><span>GNOT</span></label>
      <button class="btn btn--chain">${label} ${min} GNOT</button></div>
      <p class="fine">At least ${min}. Outbid? Your GNOT comes straight back.</p>`;
  const action = {
    live: form(),
    outbid: `<p class="note note--warn"><b>Outbid.</b> Your 1,240 GNOT is back in your Adena.</p>${form("Bid")}`,
    leading: `<p class="note note--good">You lead. Nothing to do until it ends.</p>`,
    extended: form(),
    ended: `<button class="btn btn--main btn--wide" style="margin:0">Hand him over to nym-zxxma042</button><p class="fine">Anyone can: one signature ends the auction.</p>`,
    won: `<button class="btn btn--gold btn--wide" style="margin:0">Play with him</button>`,
    nobid: `<p class="note note--warn">He comes back in the last wave, at the same reserve.</p>`,
    upcoming: `<button class="btn btn--ghost btn--wide" style="margin:0">♡ Remind me</button>`,
  }[s];
  const bids = [["nym-zxxma042", "1,368", "17:52"], ["nym-twee", "1,302", "Fri 21:04"], ["nym-moustache943", "1,240", "Fri 12:30"], ["nym-pebble77", "1,100", "Thu 19:12"], ["nym-itsok123", "777", "Thu 18:05"]];
  const shown = { live: 3, outbid: 4, leading: 4, extended: 5, ended: 5, won: 5 }[s] || 0;
  const list = bids.slice(5 - shown).map(([w, a, t]) => `<li class="${w === "nym-twee" ? "me" : ""}"><span>${w === "nym-twee" ? "You" : w}</span><b>${a} GNOT</b><time>${t}</time></li>`).join("");
  const share = s === "leading" ? "Share the auction" : s === "won" ? "Show him off" : s === "upcoming" || s === "nobid" ? "" : "Share the auction";

  document.getElementById("app").innerHTML = `
    ${corners("Back to the gnomes", `<button class="adena adena--on" aria-label="Adena, connected as nym-twee"><span class="adena__logo">A</span><span class="adena__text"><small>Adena</small><b>nym-twee</b></span></button>`)}
    <div class="au">
      <span class="gtile gtile--legendary au__tile" role="img" aria-label="The Windmill King, turning"><img src="img/g12.png" alt=""></span>
      <div class="au__info">
        <div class="au__meta"><span class="tier tier--legendary">${TIER_ICON.legendary}Legendary · one of one</span><span>#715</span></div>
        <h1 class="au__name inked">The Windmill King</h1>
        <section class="panel panel--deep bid" aria-label="The auction">${head}${action}
          ${list ? `<details class="more"><summary>The bids · ${shown}</summary><ol class="hist">${list}</ol></details>` : ""}
          <details class="more"><summary>How the auction works</summary><p>48 hours. Each bid beats the last by 5%, or 5 GNOT if more. A bid in the last 10 minutes moves the end 10 minutes on. The reserve, 777 GNOT, never goes down. <a href="#">The contract ↗</a></p></details>
        </section>
        ${share ? `<a class="linkish shareit" href="share.html?state=${s === "won" ? "won" : "bidding"}">${share} →</a>` : ""}
      </div>
    </div>
    ${netbanner()}`;
</script>
</body>
</html>
