<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My gnomes · Gnogolf mockup</title>
<link rel="stylesheet" href="kit.css">
<!-- A player's gnomes, shown off: each one large, the Legendary on his sunburst, the worn one marked,
     one tap to wear, one tap to share the team. Someone else's: the same shelf, read-only.
     states: ?state=many (default: 31, paged by 12) | few (3) | one | empty | theirs (another player's, from a board row, a friend, a ghost) -->
<style>
  .col { width: min(1120px, 100%); margin: 0 auto; display: grid; gap: var(--sp-5); }
  .col__sum { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); margin-top: var(--sp-3); }
  .col__sum .tier { font-size: 13px; }
  .col__act { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-3); margin-top: var(--sp-4); }
  .col__act .btn { margin: 0; }
  /* the shelf: big tiles, one row height, the names and actions on one baseline */
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: var(--sp-5); }
  .item { position: relative; display: grid; grid-template-rows: auto auto 1fr; gap: var(--sp-2); padding: var(--sp-2) var(--sp-2) var(--sp-3); border: var(--edge-bold); border-radius: var(--r-card); background: var(--white); box-shadow: var(--shadow-btn); min-width: 0; }
  .item .gtile { border-radius: 16px; }
  .item__name { display: grid; justify-items: start; gap: var(--sp-1); margin: 0 var(--sp-1); min-width: 0; }
  .item__name b { max-width: 100%; }
  .item__name b { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item__foot { display: flex; align-items: center; min-height: 40px; gap: var(--sp-2); margin: 0 var(--sp-1); }
  .item__foot .btn { min-height: 40px; }
  .worn { position: absolute; top: -12px; right: -8px; z-index: 3; padding: 2px 12px; border: var(--edge); border-radius: var(--pill); background: var(--gold); font-size: 13px; font-weight: 800; transform: rotate(4deg); }
  .item--worn { box-shadow: 0 0 0 3px var(--gold), 0 4px 0 3px var(--ink); }
  /* a Rare or better: its trail and holing a tap away, on the tile's corner */
  .fx { position: absolute; left: var(--sp-3); bottom: var(--sp-3); z-index: 3; display: inline-flex; align-items: center; gap: var(--sp-1); height: 32px; padding: 0 var(--sp-3); border: var(--edge); border-radius: var(--pill); background: rgba(var(--paper-rgb), .95); font-size: 13px; font-weight: 800; }
  .fx svg { width: 14px; height: 14px; }
  .item__tile { position: relative; }
  /* the one gnome: the stage is his */
  .solo { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: var(--sp-6); align-items: center; width: min(820px, 100%); margin: 0 auto; }
  .solo .gtile { border-radius: var(--r-panel); box-shadow: var(--deep-card); }
  .solo h2 { margin: 0; font-size: 40px; line-height: 1; --ink-w: 6px; --ink-drop: 4px; }
  .solo p { margin: 0; font-size: 16px; line-height: 1.45; }
  .solo > div { display: grid; gap: var(--sp-3); justify-items: start; }
  .more-row { display: grid; justify-items: center; gap: var(--sp-2); }
  .more-row .fine { margin: 0; }
  .blank { display: grid; justify-items: center; gap: var(--sp-4); max-width: 460px; margin: 0 auto; text-align: center; }
  .blank p { margin: 0; font-size: 16px; line-height: 1.45; }
  @media (max-width: 600px) {
    .shelf { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-3); }
    .item__name b { font-size: 15px; }
    .item__foot .btn { width: 100%; }
    .fx { left: var(--sp-2); bottom: var(--sp-2); height: 28px; padding: 0 var(--sp-2); }
    .solo { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .solo > div { justify-items: center; }
  }
</style>
</head>
<body>
<main class="front tint--shop" id="app"></main>
<script src="kit.js"></script>
<script>
  const { ICON, tierChip, state, corners, netbanner } = Kit;
  const s = state("many");
  const theirs = s === "theirs";
  // the player's gnomes, Legendary first, then by tier, then by number (stand-ins)
  const ALL = [["The Windmill King", 715, "legendary", "img/g12.png", "garden"], ["Tansy", 94, "epic", "img/g02.png", "garden"], ["Garnet", 640, "epic", "img/g13.png", "mines"], ["Coral", 175, "rare", "img/g09.png", "island"], ["Kelp", 181, "rare", "img/g08.png", "island"], ["Flint", 377, "rare", "img/g06.png", "mountain"],
    ["Basil", 2, "common", "img/g10.png", "garden"], ["Moss", 4, "common", "img/g03.png", "garden"], ["Pip", 20, "common", "img/g07.png", "garden"], ["Crumpet", 210, "common", "img/g11.png", "town"], ["Barley", 214, "common", "img/g05.png", "town"], ["Quartz", 611, "common", "img/g04.png", "mines"]];
  const list = s === "few" ? [ALL[1], ALL[3], ALL[6]] : ALL;
  const worn = theirs ? 715 : 94;
  const count = { many: 31, few: 3, one: 1, empty: 0, theirs: 12 }[s];

  const item = ([n, id, tier, img, world]) => `<article class="item${id === worn ? " item--worn" : ""}" aria-label="${n}, ${tier}${id === worn ? ", worn" : ""}">
      ${id === worn ? `<span class="worn">${theirs ? "Worn" : "On your ball"}</span>` : ""}
      <div class="item__tile"><span class="gtile gtile--${tier} tint--${world}"><img src="${img}" alt="" loading="lazy"></span>
        ${tier !== "common" ? `<button class="fx" aria-label="See ${n}'s ${tier === "legendary" ? "entrance and holing" : "trail and holing"}">${ICON.play}${tier === "legendary" ? "His holing" : "Trail"}</button>` : ""}</div>
      <div class="item__name"><b>${n}</b>${tierChip(tier)}</div>
      <div class="item__foot">${theirs ? `<a class="linkish" href="gnome-detail.html?state=taken">#${id}</a>` : id === worn ? `<span class="fine" style="margin:0">Your ghost wears him</span>` : `<button class="btn btn--chain btn--s">Wear him</button>`}</div>
    </article>`;
  const sum = `<div class="col__sum" aria-label="By tier">${(theirs ? [["legendary", 1], ["epic", 2], ["rare", 3], ["common", 6]] : [["legendary", 1], ["epic", 2], ["rare", 6], ["common", 22]]).map(([t, n]) => tierChip(t).replace(/<\/span>$/, ` · ${n}</span>`)).join("")}</div>`;

  const body = s === "empty"
    ? `<div class="blank"><p>None yet. You play with the free five and the gnomes you earn on the course.</p><a class="btn btn--ghost" href="gnomes-gallery.html">See the gallery</a></div>`
    : s === "one"
    ? `<div class="solo"><span class="gtile gtile--epic tint--garden"><img src="img/g02.png" alt=""></span>
        <div>${tierChip("epic")}<h2 class="inked">Tansy</h2><p>On your ball, and on your ghost for every rival who races it.</p>
        <button class="btn btn--gold btn--cta" style="margin:0">Share him</button></div></div>`
    : `<div class="shelf">${list.map(item).join("")}</div>
       ${s === "many" ? `<div class="more-row"><button class="btn btn--ghost">Show 12 more</button><p class="fine">12 of ${count}</p></div>` : ""}`;

  document.getElementById("app").innerHTML = `
    ${corners(theirs ? "Back to the boards" : "Back to the game")}
    <div class="col">
      <header class="front__head">
        <span class="eyebrow--pill">${theirs ? "Their gnomes" : "My gnomes"}</span>
        <h1 class="display inked">${theirs ? "nym-itsok123's team" : s === "empty" ? "Your team" : `Your team of ${count}`}</h1>
        ${s === "many" || theirs ? sum : ""}
        ${s === "empty" || s === "one" ? "" : `<div class="col__act">${theirs ? `<button class="btn btn--gold btn--cta">Race their ghost</button>` : `<a class="btn btn--gold btn--cta" href="share.html?state=team">Share my team</a>`}</div>`}
      </header>
      ${body}
    </div>
    ${netbanner()}`;
</script>
</body>
</html>
