<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gnomes gallery · Gnogolf mockup</title>
<link rel="stylesheet" href="kit.css">
<!-- states: ?state=open (default) | players (the players' window, this wallet without a record) | empty | loading | error | soldout | teaser (nothing on sale yet) -->
<style>
  .gal { width: min(1180px, 100%); margin: 0 auto; }
  .gal__lead { margin: 6px 0 0; max-width: 560px; font-size: 16px; font-weight: 600; line-height: 1.4; }

  /* the drops: this wave, its Legendary's auction, the next wave */
  .drops { display: grid; grid-template-columns: 1.35fr 1fr .8fr; gap: var(--gap-grid); margin: 22px 0 26px; }
  .drop { position: relative; display: grid; align-content: start; gap: 8px; color: inherit; text-decoration: none; }
  .drop h3 { margin: 0; font-size: 22px; line-height: 1.1; }
  .drop p { margin: 0; font-size: 14px; line-height: 1.4; color: var(--ink-soft); }
  .drop__row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .drop__count { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
  .drop--auction { grid-template-columns: 112px 1fr; gap: 6px 14px; background: var(--panel-dots), #2b2550; color: var(--paper); border-color: var(--ink); }
  .drop--auction p { color: rgba(var(--paper-rgb), .8); }
  .drop--auction .gtile { grid-row: 1 / 5; border-radius: 16px; }
  .drop--auction b.big { font-size: 24px; color: var(--tier-legendary); }
  .drop--next { background: transparent; border-style: dashed; }

  /* the filters: what is shown, then which, then a name */
  .filters { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px 0 14px; background: linear-gradient(var(--s0) 80%, transparent); }
  .filters .seg button { min-height: 40px; padding: 6px 14px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 8px; border: var(--edge); border-radius: var(--pill); background: var(--paper); font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 0 var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chip small { font-weight: 600; opacity: .7; }
  .chip .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); }
  .chip svg { width: 14px; height: 14px; fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
  .search { position: relative; margin-left: auto; width: 240px; }
  .search svg { position: absolute; left: 12px; top: 13px; width: 20px; height: 20px; color: var(--ink-soft); }
  .search .field { padding-left: 40px; height: 44px; }
  .filters__more { display: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(164px, 1fr)); gap: 18px; }
  .shown { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .blank { display: grid; justify-items: center; gap: 10px; padding: 50px 20px; text-align: center; }
  .blank h3 { margin: 0; font-size: 24px; }
  .blank p { margin: 0; color: var(--ink-soft); max-width: 420px; line-height: 1.45; }
  .skel { aspect-ratio: .78; border: 3px dashed rgba(var(--ink-rgb), .25); border-radius: var(--r-card); }

  .foot { margin: 34px auto 0; padding-top: 18px; border-top: var(--rule); display: grid; gap: 8px; justify-items: center; text-align: center; }
  .foot .trust { justify-content: center; }

  @media (max-width: 900px) {
    .drops { grid-template-columns: 1fr; }
    .drop--next { display: none; }
  }
  /* a phone: two columns, the filters in a bottom sheet behind one button */
  @media (max-width: 600px) {
    .gal__lead { font-size: 14px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .filters .chips, .filters .search, .filters .sort { display: none; }
    .filters { flex-wrap: nowrap; }
    .filters .seg { flex: 1; }
    .filters__more { display: inline-flex; }
    .gcard__name { font-size: 14px; }
    .drop--auction { grid-template-columns: 84px 1fr; }
  }
</style>
</head>
<body>
<main class="front tint--shop" id="app"></main>
<script src="kit.js"></script>
<script>
  const { ICON, TIER_ICON, tierChip, gnome, state, corners, netbanner, shareRow } = Kit;
  const s = state("open");
  const owners = { 3: "nym-moustache943", 5: "nym-itsok123", 9: "nym-zxxma042", 14: "nym-twee", 17: "nym-pebble77", 22: "nym-itsok123", 31: "nym-bramble01", 74: "nym-zxxma042", 93: "nym-twee", 95: "nym-gnorman" };
  const mine = new Set([14, 93]);
  const list = Array.from({ length: s === "soldout" ? 18 : 24 }, (_, i) => gnome(i + 1, s === "soldout" ? Object.fromEntries(Array.from({ length: 101 }, (_, k) => [k + 1, "nym-somebody" + k])) : owners));
  // a few of the wave's Rares and Epics in the first rows, as "Sort: tier" would show them
  list.splice(4, 0, gnome(93, owners), gnome(95, owners), gnome(74 + 20, owners));
  const later = [gnome(102), gnome(176), gnome(195)];

  const card = (g, opts = {}) => {
    const isMine = mine.has(g.id), taken = g.owner && !isMine;
    const cls = ["gcard", isMine && "gcard--mine", taken && "gcard--taken", opts.later && "gcard--later", g.id === 14 && "gcard--equipped"].filter(Boolean).join(" ");
    const foot = opts.later
      ? `${tierChip(g.tier)}<span class="gcard__who">Wave ${Math.floor((g.id - 1) / 101) + 1}</span>`
      : isMine ? `${tierChip(g.tier)}<span class="gcard__who">Yours</span>`
      : taken ? `${tierChip(g.tier)}<span class="gcard__who">${g.owner}</span>`
      : `${tierChip(g.tier)}<span class="gcard__price">${g.price} <small>GNOT</small></span>`;
    return `<button class="${cls}" aria-label="${g.name}, number ${g.id}, ${g.tier}${taken ? ", plays with " + g.owner : isMine ? ", yours" : opts.later ? ", not on sale yet" : ", " + g.price + " GNOT"}">
      ${taken ? '<span class="tag gcard__stamp">Taken</span>' : ""}
      <span class="gtile gtile--${g.tier} tint--${g.world}"><img src="${g.art}" alt="" loading="lazy"></span>
      <span class="gcard__name">${g.name.split(" of ")[0]}<small>#${g.id}</small></span>
      <span class="gcard__foot">${foot}</span></button>`;
  };

  const waveCard = s === "teaser"
    ? `<section class="drop panel panel--deep"><div class="drop__row"><span class="tag">Wave 1 · Garden</span><span class="tag tag--gold">Opens Thu 9 Oct · 18:00 UTC</span></div>
        <h3>Look around, nothing's for sale yet</h3><p>Every gnome is here to meet before the first wave opens, traits and price included. Tap ♡ to keep a list in this browser.</p></section>`
    : s === "soldout"
    ? `<section class="drop panel panel--deep"><div class="drop__row"><span class="tag">Wave 1 · Garden</span><span class="tag tag--hat">Every gnome found a player</span></div>
        <h3>The Garden's 101 are all out playing</h3><p>Wave 2 opens on the Island: its gnomes are below, to meet before then.</p>
        <div class="track"><i style="width:100%"></i></div><div class="drop__count"><span>101 of 101 found a player</span><span>412 different players</span></div></section>`
    : `<section class="drop panel panel--deep">
        <div class="drop__row"><span class="tag">Wave 1 · Garden</span><span class="tag tag--gold">Players first · until Thu 18:00 UTC</span></div>
        <h3>The Garden's gnomes are out</h3>
        <p>${s === "players" ? "Until Thursday, these go to wallets with a score on the boards. Save one round on-chain and you're in." : "Until Thursday, to wallets with a score on the boards: 3 Commons, 2 Rares, 1 Epic each. Then to everyone."}</p>
        <div class="track"><i style="width:57%"></i></div>
        <div class="drop__count"><span>58 of 101 found a player</span><span>Open to everyone Thu 18:00 UTC</span></div>
      </section>`;

  const auction = `<a class="drop panel panel--deep drop--auction" href="gnome-auction.html">
      <span class="gtile gtile--legendary"><img src="img/g12.png" alt=""></span>
      <span class="drop__row"><span class="tier tier--legendary">${TIER_ICON.legendary}Legendary · one of one</span></span>
      <h3>The Windmill King</h3>
      <p>Top bid <b class="big">1,240</b> GNOT · ends Sat 18:00 UTC</p>
      <span class="drop__row"><span class="btn btn--gold btn--s">Bid →</span></span></a>`;

  const next = `<section class="drop panel drop--next"><span class="tag">Next · Wave 2 · Island</span>
      <h3>Coral, Kelp and friends</h3><p>Opens when the Garden's wave is 70% home. Their gnomes are below already, to meet.</p></section>`;

  const filters = `<div class="filters" role="search">
      <div class="seg" role="radiogroup" aria-label="Show"><button role="radio" class="on" aria-checked="true">On sale</button><button role="radio" aria-checked="false">Mine · 2</button><button role="radio" aria-checked="false">All 720</button></div>
      <div class="chips" aria-label="Tier">
        <button class="chip" aria-pressed="true"><span class="tier tier--common" style="padding:0;border:0;background:none">${TIER_ICON.common}</span>Common <small>43</small></button>
        <button class="chip" aria-pressed="true"><span class="tier" style="padding:0;border:0;background:none">${TIER_ICON.rare}</span>Rare <small>11</small></button>
        <button class="chip" aria-pressed="true"><span class="tier" style="padding:0;border:0;background:none">${TIER_ICON.epic}</span>Epic <small>4</small></button>
      </div>
      <div class="chips" aria-label="Hat">
        <button class="chip" aria-pressed="false">Bobble hat</button><button class="chip" aria-pressed="false">Glasses</button><button class="chip" aria-pressed="false">Trail ▾</button>
      </div>
      <label class="search"><span class="sr" hidden>Find a gnome</span>${ICON.search}<input class="field" placeholder="A name or a number: Fennel, #214"></label>
      <button class="btn btn--ghost btn--s filters__more">Filters · 2</button>
    </div>`;

  const body = s === "loading"
    ? `<p class="shown">Reading the gnomes from the chain…</p><div class="grid">${Array.from({ length: 12 }, () => '<span class="skel"></span>').join("")}</div>`
    : s === "error"
    ? `<div class="blank"><h3>The chain did not answer</h3><p>The gnomes are all here, but who has which could not be read. Try again in a moment.</p><button class="btn btn--main">Try again</button></div>`
    : s === "empty"
    ? `<div class="blank"><h3>No gnome like that one, yet</h3><p>No Epic with glasses in this wave. Try another world, or look at every wave's gnomes.</p><button class="btn btn--ghost">Show all 720</button></div>`
    : `<p class="shown">${s === "soldout" ? "Wave 1 · Garden · all 101 playing" : "Wave 1 · Garden · 43 Commons, 11 Rares and 4 Epics on sale · sorted by number"}</p>
       <div class="grid">${list.map((g) => card(g)).join("")}${later.map((g) => card(g, { later: true })).join("")}</div>`;

  document.getElementById("app").innerHTML = `
    ${corners("Back to the game", `<button class="adena adena--on" aria-label="Adena, connected as nym-twee"><span class="adena__logo">A</span><span class="adena__text"><small>Adena · connected</small><b>nym-twee</b></span></button>`)}
    <div class="gal">
      <header class="front__head">
        <span class="eyebrow--pill">The gnomes<span class="wide-only"> · 720, each one of a kind</span></span>
        <h1 class="display inked">Who's on the ball?</h1>
        <p class="gal__lead">Pick the exact gnome you want. He rolls for you, and every rival who races your ghost sees him.</p>
      </header>
      <div class="drops">${waveCard}${auction}${next}</div>
      ${s === "players" ? `<p class="note note--warn" style="margin:-8px 0 16px"><b>Players first until Thursday.</b> This wallet has no score on the boards yet: save one round on-chain to buy now, or come back Thursday at 18:00 UTC. <a href="#">Play a hole →</a></p>` : ""}
      ${filters}
      ${body}
      <footer class="foot">
        <ul class="trust">
          <li>You pick the exact gnome: no random draw</li>
          <li>Cosmetic only: every gnome rolls the same</li>
          <li>Paid straight to the game's account, in the same transaction</li>
          <li><a href="#">The contract on gnoweb ↗</a></li>
        </ul>
        <p class="fine">For adults. A gnome is a game cosmetic, not an investment: nothing promises it can be sold on. <a class="linkish" href="#">How the gnomes work</a></p>
      </footer>
    </div>
    ${netbanner()}`;
</script>
</body>
</html>
