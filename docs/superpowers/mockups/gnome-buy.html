<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buying a gnome · Gnogolf mockup</title>
<link rel="stylesheet" href="kit.css">
<!-- Buying: a sheet over the gnome's page. The bill, one line of consent, one button.
     states: ?state=confirm (default) | connect | nowallet | elsewhere (a phone, no Adena) | network | short
     | pending | reading | success | taken | cancelled | unsure -->
<style>
  body { overflow: hidden; height: 100vh; }
  .behind { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .sheet__in { max-width: 440px; display: grid; gap: var(--sp-4); }
  .sheet__in > :not(.sheet__foot) { margin: 0 !important; }
  .head { display: grid; justify-items: center; gap: var(--sp-2); }
  .head .gtile { width: 64px; border-radius: 14px; }
  .head h2 { font-size: 26px; margin: 0; }
  /* the bill: label left, amount right, one baseline; the total under a rule */
  .bill { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-2) var(--sp-4); padding: var(--sp-3) var(--sp-4); border: var(--edge); border-radius: 14px; background: var(--white); font-size: 15px; align-items: baseline; }
  .bill b { text-align: right; }
  .bill .bill__total { padding-top: var(--sp-2); border-top: var(--rule); font-size: 17px; }
  .bill b.bill__total { font-size: 20px; }
  .bill small { grid-column: 1 / -1; text-align: right; font-size: 13px; color: var(--ink-soft); margin-top: calc(-1 * var(--sp-1)); }
  .consent { font-size: 13px; color: var(--ink-soft); line-height: 1.45; }
  .sheet__in .btn--wide { margin: 0; min-height: 52px; font-size: 17px; font-weight: 700; }
  .center { text-align: center; justify-items: center; }
  .center .gtile { width: 168px; border-radius: var(--r-panel); box-shadow: var(--deep-card); }
  .center h2 { font-size: 34px; --ink-w: 6px; --ink-drop: 4px; }
  .hop { animation: hop .7s ease-in-out infinite alternate; }
  @keyframes hop { to { transform: translateY(-12px); } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .pop { animation: pop .5s var(--spring); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); width: 100%; }
  .row2 .btn { margin: 0; min-height: 52px; }
  @media (max-width: 600px) { .consent { font-size: 15px; } }
</style>
</head>
<body>
<iframe class="behind" src="gnome-detail.html" title="The gnome's page, behind the sheet" aria-hidden="true" tabindex="-1"></iframe>
<div class="sheet" id="app"></div>
<script src="kit.js"></script>
<script>
  const { ICON, state } = Kit;
  const s = state("confirm");
  const tile = (cls = "") => `<span class="gtile gtile--epic tint--garden ${cls}"><img src="img/g02.png" alt=""></span>`;
  const head = `<div class="head">${tile()}<h2>Buy Tansy</h2></div>`;
  const bill = (balance = false) => `<div class="bill" aria-label="The bill">
      <span>Tansy of the Garden</span><b>333 GNOT</b>
      <span>Storage deposit</span><b>≈ 0.31 GNOT</b>
      <span>Network fee</span><b>≈ 0.02 GNOT</b>
      <span class="bill__total">At most</span><b class="bill__total">333.33 GNOT</b>
      <small>${balance ? "In your Adena: 120 GNOT" : "≈ $23 at today's rate"}</small></div>`;
  const consent = `<p class="consent">Buy sends the GNOT now, straight to the game's account, and he's yours at once: no 14-day return. For adults.</p>`;
  const buy = `<div class="sheet__foot"><button class="btn btn--chain btn--wide">Buy in Adena · 333.33 GNOT</button></div>`;
  const foot = (b) => `<div class="sheet__foot">${b}</div>`;
  const gnokey = (open = false) => `<details class="more"${open ? " open" : ""}><summary>Buy with gnokey instead</summary>
    <div><code class="code">gnokey maketx call -pkgpath "gno.land/r/gnogolf/gnomes" -func "Mint" -args "94" -send "333000000ugnot" -gas-fee 1000000ugnot -gas-wanted 30000000 -broadcast -chainid gnoland-1 -remote https://rpc.gno.land:443 my-key</code>
    <button class="btn btn--main btn--s" style="margin-top:8px">Copy</button></div></details>`;
  const close = `<button class="round round--small sheet__close" aria-label="Close">${ICON.close}</button>`;
  const wait = (t) => `<div class="center" style="display:grid;gap:var(--sp-4)">${tile("hop")}<h2 style="font-size:24px">${t}</h2></div>`;

  const body = {
    confirm: `${head}${bill()}${consent}${gnokey()}${buy}`,
    connect: `${head}<p class="lead">Connect Adena, the gno.land wallet, to buy.</p>${gnokey()}${foot(`<button class="btn btn--main btn--wide">Connect Adena</button>`)}`,
    nowallet: `${head}<p class="lead">Buying takes a gno.land wallet.</p>${gnokey(true)}${foot(`<a class="btn btn--main btn--wide" href="#">Install Adena ↗</a>`)}`,
    elsewhere: `${head}<p class="lead">Adena lives on a computer. The link keeps Tansy for you there.</p>${foot(`<button class="btn btn--main btn--wide">Send the link to my computer</button>`)}`,
    network: `${head}<p class="note note--warn">Adena is on another network. Pick <b>gnoland-1</b> in Adena: nothing was sent.</p>${foot(`<button class="btn btn--main btn--wide">Check again</button>`)}`,
    short: `${head}${bill(true)}<p class="note note--warn"><b>213.33 GNOT</b> to go.</p>${foot(`<a class="btn btn--main btn--wide" href="#">Get GNOT ↗</a>`)}`,
    pending: wait("Sign in Adena…"),
    reading: wait("Reading it back from the chain…"),
    success: `<div class="center" style="display:grid;gap:var(--sp-4)">${tile("pop")}<h2 class="inked">Tansy's yours!</h2>
      <div class="row2"><button class="btn btn--gold">Play with him</button><a class="btn btn--ghost" href="share.html?state=bought">${ICON.more} Show your gnome</a></div></div>`,
    taken: `${head}<p class="note note--bad">Someone took Tansy a moment before you. <b>Nothing was sent.</b></p>${foot(`<a class="btn btn--main btn--wide" href="gnomes-gallery.html">Pick another</a>`)}`,
    cancelled: `${head}<p class="note note--bad">Cancelled in Adena: nothing was sent.</p>${bill()}${buy}`,
    unsure: `${head}<p class="note note--warn">Sent, but not confirmed yet. <b>Don't buy again</b>: it would pay twice.</p>${foot(`<button class="btn btn--main btn--wide">Check again</button>`)}`,
  }[s];
  document.getElementById("app").innerHTML = `<div class="sheet__in${["pending", "reading", "success", "taken", "unsure"].includes(s) ? " sheet__in--banner" : ""}" role="dialog" aria-modal="true" aria-label="Buy Tansy of the Garden">${s === "pending" || s === "reading" ? "" : close}${body}</div>`;
</script>
</body>
</html>
