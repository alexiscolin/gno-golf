<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Testing a hole · Gnogolf mockup</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="builder.css">
<!-- Test mode: the game itself on the Builder's local chain, its HUD as in play, the proof on the right.
     states: ?state=playing (default: the rain still to hole) | proved (every weather holed: publish) | missed (a round that does not count) -->
<style>
  body { margin: 0; height: 100vh; overflow: hidden; overscroll-behavior: none; background: #2f6b53 url(img/play-garden3.jpg) 30% center / cover no-repeat; }
  .hud { position: fixed; top: var(--sp-3); left: var(--sp-3); display: flex; gap: var(--sp-3); }
  .card { min-width: 84px; text-align: center; }
  .card--hole { position: relative; min-width: 220px; text-align: left; }
  .card--hole .eyebrow { padding-left: 46px; }
  .modetag { position: absolute; top: -12px; left: -8px; padding: 0 10px 2px; border: var(--edge-bold); border-radius: var(--pill); background: var(--sunny); font-size: 16px; font-weight: 700; transform: rotate(-3deg); box-shadow: 0 2px 0 var(--ink); --ink-w: 3px; --ink-drop: 0; }
  .proof { position: fixed; top: var(--sp-3); right: var(--sp-3); bottom: var(--sp-3); width: 340px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border: var(--edge); border-radius: 24px; background: var(--paper); box-shadow: -6px 6px 0 var(--ink); overflow: hidden; }
  /* the head and the action pinned, the middle scrolls in itself */
  .proof > header, .proof > footer { padding: var(--sp-4) var(--sp-5); }
  .proof > header { border-bottom: var(--rule); }
  .proof > footer { display: grid; gap: var(--sp-2); border-top: var(--rule); }
  .proof > footer .btn { margin: 0; min-height: 52px; }
  .proof__body { overflow: auto; overscroll-behavior: contain; padding: var(--sp-4) var(--sp-5); display: grid; align-content: start; gap: var(--sp-4); }
  .proof h2 { margin: var(--sp-1) 0 0; font-size: 24px; line-height: 1.15; }
  .par { display: grid; grid-template-columns: auto 1fr auto; gap: var(--sp-3); align-items: center; padding: var(--sp-3); border: var(--edge); border-radius: 14px; background: var(--white); }
  .par b { font-size: 30px; line-height: 1; }
  .par .seg button { min-height: 36px; width: 40px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="kit.js"></script>
<script>
  // the Builder needs 900 px: narrower, its play-only screen
  if (matchMedia("(max-width: 899px), (pointer: coarse)").matches) location.replace("builder-phone.html");
  const { ICON, state } = Kit;
  const s = state("playing");
  const proved = s === "proved";
  const rows = [["☀", "Clear", "3 strokes", true], ["≋", "Wind", "4 strokes", true], ["☂", "Rain", proved ? "4 strokes" : s === "missed" ? "Doesn't count" : "Playing now", proved]];
  document.getElementById("app").innerHTML = `
    <header class="hud">
      <div class="card card--hole"><span class="modetag inked">Test</span><span class="eyebrow">Your hole</span><h1>Mole Run</h1></div>
      <div class="card"><span class="eyebrow">Strokes</span><strong>${proved ? 4 : 2}</strong></div>
      <div class="card"><span class="eyebrow">Weather</span><strong style="font-size:20px">Rain</strong></div>
    </header>
    <aside class="proof" aria-label="The proof">
      <header><span class="eyebrow">Test · free, nothing is sent</span><h2>${proved ? "Holed in every weather" : "Hole it in each weather"}</h2></header>
      <div class="proof__body">
        <ul class="proofs">${rows.map(([g, n, sub, done]) => `<li class="${done ? "done" : ""}"><span class="wx" aria-hidden="true">${g}</span><span>${n}<br><small style="font-weight:600;color:var(--ink-soft)">${sub}</small></span>${done ? '<span style="color:var(--green);font-size:20px">✓</span>' : s === "missed" ? '<button class="btn btn--ghost btn--s">Again</button>' : '<span class="tag tag--gold">Now</span>'}</li>`).join("")}</ul>
        ${s === "missed" ? `<p class="note note--warn" style="margin:0">One shot could run out of room in the rain. Try a softer line.</p>` : ""}
        ${proved ? `<div class="par"><span class="eyebrow">Par</span><b>5</b><div class="seg seg--s" aria-label="Par"><button aria-label="Lower" disabled>−</button><button aria-label="Higher">+</button></div></div>` : ""}
        <details class="more"><summary>Why each weather?</summary><p>Wind, rain and the rest change how the ball rolls. The weather here is your hole's real one. Moving a piece drops these rounds.</p></details>
      </div>
      <footer>${proved ? `<button class="btn btn--chain">Publish…</button>` : ""}<button class="btn btn--ghost">Back to the editor</button></footer>
    </aside>`;
</script>
</body>
</html>
