<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Builder · Gnogolf mockup</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="builder.css">
<!-- The editor: build, then test. One primary action at a time (Test it, then Publish).
     The window never scrolls: the palette and the inspector scroll in themselves, the board pans and zooms.
     states: ?state=select (default: a bumper selected) | timed (the gate selected: its cycle) | issues (an error: Test waits)
     | proved (holed in every weather: Publish). A phone, a touch screen or under 900 px: builder-phone.html, the editor never loads. -->
<style>
</style>
</head>
<body>
<div id="app"></div>
<script src="kit.js"></script>
<script src="builder.js"></script>
<script>
  const { ICON, state, corners } = Kit;
  const { holeSVG, PIECE } = Builder;
  // the editor needs a mouse, a keyboard and 900 px: under that, the play-only screen
  // a phone, a touch screen, under 900 px: no editor (nor builder.wasm), the one phone screen
  if (matchMedia("(max-width: 899px), (pointer: coarse)").matches) location.replace("builder-phone.html");
  const s = state("select");
  const app = document.getElementById("app");
  {

    const issues = s === "issues", proved = s === "proved", sel = s === "timed" ? "gate" : "bumper";
    const tools = [["tee", "Tee"], ["cup", "Cup"]];
    const pieces = [["rail", "Rail"], ["hedge", "Hedge"], ["logs", "Logs"], ["gate", "Gate"], ["bumper", "Mushroom"], ["sunflower", "Sunflower"], ["stump", "Stump"], ["molehill", "Molehill"], ["sand", "Sand"], ["water", "Pond"], ["ice", "Ice"], ["flowerbed", "Flowerbed"], ["slope", "Slope"], ["seesaw", "Seesaw"], ["tunnel", "Tunnel"]];
    const piece = ([k, label]) => `<button class="piece${k === sel ? " piece--on" : ""}">${PIECE[k]}${label}</button>`;

    const inspector = sel === "bumper" ? `
      <div class="insp__head">${PIECE.bumper.replace("<svg", '<svg width="40" height="30"')}<b>Mushroom</b></div>
      <label class="range">Size<input type="range" min="0.6" max="1.6" step="0.1" value="1.2"><output>1.2</output></label>
      <label class="range">Bounce<input type="range" min="0.5" max="1.4" step="0.05" value="1.25"><output>1.25</output></label>
      <div class="range"><span>Timing</span><div class="seg seg--s" style="grid-column:2/-1"><button class="on">Always</button><button>Comes and goes</button></div></div>`
      : `
      <div class="insp__head">${PIECE.gate.replace("<svg", '<svg width="40" height="30"')}<b>Gate</b></div>
      <label class="range">Length<input type="range" min="2" max="12" step="0.5" value="10"><output>10</output></label>
      <div class="range"><span>Timing</span><div class="seg seg--s" style="grid-column:2/-1"><button>Always</button><button class="on">In a stroke</button><button>Strokes</button></div></div>
      <label class="range">Shut<input type="range" min="1" max="7" value="3"><output>3 / 8</output></label>
      <label class="range">From<input type="range" min="0" max="7" value="2"><output>step 2</output></label>
      <div class="cycle" aria-label="Shut on steps 2, 3 and 4 of 8">${Array.from({ length: 8 }, (_, i) => `<i class="${i >= 2 && i < 5 ? "on" : ""}"></i>`).join("")}</div>`;

    const gauges = [["Walls", 23, 160], ["Posts", 5, 32], ["Zones", 6, 32], ["Pulses", 0, 16], ["Points", 38, 512], ["Data KB", 2.4, 32]]
      .map(([n, v, max]) => `<div class="gauge"><span>${n}<em>${v} / ${max}</em></span><i><b style="width:${Math.max(2, Math.round((v / max) * 100))}%"></b></i></div>`).join("")
      + `<div class="gauge" style="grid-column:1/-1"><span>A shot's room in a storm<em>64%</em></span><i><b style="width:64%"></b></i></div>`;
    const checks = issues
      ? `<ul class="issues"><li class="issue issue--error" role="button">The cup touches the hedge. Move one.</li><li class="issue issue--error" role="button">The loop is 1.2 deep: 1.5 at least.</li></ul>`
      : `<p class="issue issue--ok">${proved ? "Holed in every weather. Par 5." : "Ready to test."}</p>`;
    const primary = proved
      ? `<button class="btn btn--ghost">${ICON.play} Test again</button><button class="btn btn--chain">Publish…</button>`
      : `<button class="btn btn--gold"${issues ? ' disabled title="Fix the 2 errors first"' : ""}>${ICON.play} Test it</button>`;

    app.innerHTML = `<main class="bench tint--garden">
      <header class="bar">
        <button class="round" aria-label="Back to the game: the draft is saved">${ICON.back}</button>
        <input class="bar__name" value="Mole Run" aria-label="The hole's name">
        <button class="btn btn--ghost btn--s" aria-haspopup="listbox" aria-label="World: Garden">Garden ▾</button>
        <span class="bar__sp"></span>
        <button class="round round--small" aria-label="Undo (Ctrl+Z)">${ICON.undo}</button>
        <button class="round round--small" aria-label="Redo (Ctrl+Shift+Z)" disabled>${ICON.redo}</button>
        ${primary}
      </header>

      <aside class="col" aria-label="The Garden's pieces">
        <div class="pieces">${tools.map(piece).join("")}</div>
        <hr>
        <div class="pieces">${pieces.map(piece).join("")}</div>
        <details class="more"><summary>Start from a template</summary><p><button class="linkish">Straight par 2</button> · <button class="linkish">Dogleg par 3</button> · <button class="linkish">The seesaw</button></p></details>
      </aside>

      <section class="board" aria-label="The board: wheel or pinch to zoom, drag empty space to pan">
        ${holeSVG({ select: sel === "bumper" ? 1 : -1, issue: issues })}
        ${sel === "bumper" ? `<span class="measure" style="left:69%;top:51%">r 1.2</span>` : ""}
        <div class="board__foot"><span class="pill">Snap 0.5 · 15°</span>
          <span class="board__zoom"><button class="round" aria-label="Keyboard shortcuts">?</button><button class="round" aria-label="Zoom out">−</button><button class="round" aria-label="Zoom in">+</button></span></div>
      </section>

      <aside class="col" aria-label="The preview and the piece">
        <div class="preview" style="background-image:url(img/play-garden3.jpg)" role="img" aria-label="The hole in 3D, as players will see it"></div>
        <div class="insp">${inspector}</div>
        <hr>
        ${checks}
        <details class="more"><summary>The chain's limits · all fine</summary><div class="gauges">${gauges}</div></details>
      </aside>
    </main>`;
  }
</script>
</body>
</html>
