# Netlify: a static export (next.config.mjs has output: "export"), no server.
# Set these in the site's environment before deploying:
#   NEXT_PUBLIC_SITE_URL  the public address, e.g. https://gno-golf.netlify.app
#                         (link previews, share links)
#   NEXT_PUBLIC_REALM     the golf realm, e.g. gno.land/r/nym-golfer000/golf on
#                         pearl (unset, it is the local gno.land/r/gnogolf/golf)
#   NEXT_PUBLIC_RPC       the gno.land RPC the game plays on (a testnet node),
#                         e.g. https://rpc.pearl.testnets.gno.land:443
#   NEXT_PUBLIC_WEB       its gnoweb, for "read its code" links,
#                         e.g. https://pearl.testnets.gno.land
#   NEXT_PUBLIC_NETWORK   testnet or mainnet: the faucet link, the title's tag
#   NEXT_PUBLIC_OTHER_URL the other deployment, linked from the About sheet
#   NEXT_PUBLIC_NAMEREG   optional: the name registrar (found on the chain otherwise)
#   NEXT_PUBLIC_COMMUNITY optional: 1 lists the community's holes with the cups
#                         (off until the builder is out)
#   NEXT_PUBLIC_CLIPS     optional: 1 offers a clip of the holing shot (ADR-003)
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# long cache for the hashed build files, none for the page itself
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    # The page talks to gno.land's nodes only (a public build ignores ?rpc=; a
    # node elsewhere, set in NEXT_PUBLIC_RPC, goes in connect-src too). Next's
    # static export inlines its bootstrap scripts, hence 'unsafe-inline'; the
    # rest is shut: no plugins, no framing, no <base> or form elsewhere.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.gno.land; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
