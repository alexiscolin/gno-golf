# Netlify: a static export (next.config.mjs has output: "export"), no server.
# Set these in the site's environment before deploying:
#   NEXT_PUBLIC_SITE_URL  the public address, e.g. https://gnogolf.netlify.app
#                         (link previews, share links)
#   NEXT_PUBLIC_RPC       the gno.land RPC the game plays on (a testnet node)
#   NEXT_PUBLIC_WEB       its gnoweb, for "read its code" links
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# long cache for the hashed build files, none for the page itself
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
